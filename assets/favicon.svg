<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bellGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284C7" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#080D1A"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Red Collar Ribbon -->
  <path d="M12 24 C12 21, 52 21, 52 24 L50 29 C50 29, 14 29, 14 29 Z" fill="url(#collarGrad)"/>

  <!-- Golden Bell -->
  <circle cx="32" cy="38" r="14" fill="url(#bellGrad)" filter="url(#glow)"/>
  <circle cx="32" cy="38" r="14" fill="none" stroke="#78350F" stroke-width="1"/>

  <!-- Bell Slit & Hole -->
  <line x1="20" y1="35" x2="44" y2="35" stroke="#78350F" stroke-width="1.6"/>
  <line x1="22" y1="37" x2="42" y2="37" stroke="#92400E" stroke-width="1"/>
  <circle cx="32" cy="41" r="2.6" fill="#451A03"/>
  <line x1="32" y1="43.6" x2="32" y2="50" stroke="#451A03" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Specular Highlight -->
  <ellipse cx="27" cy="33" rx="3.5" ry="2" fill="#FEF08A" opacity="0.8" transform="rotate(-20 27 33)"/>
</svg>
