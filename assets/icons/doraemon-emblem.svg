<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <radialGradient id="emblemGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emblemBell" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#emblemGlow)"/>
  <circle cx="60" cy="60" r="50" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4 3" stroke-opacity="0.6"/>

  <!-- Rotating Gyro Nodes -->
  <circle cx="60" cy="10" r="3" fill="#38BDF8"/>
  <circle cx="60" cy="110" r="3" fill="#38BDF8"/>
  <circle cx="10" cy="60" r="3" fill="#38BDF8"/>
  <circle cx="110" cy="60" r="3" fill="#38BDF8"/>

  <!-- Doraemon Whiskers Motif (Cybernetic HUD Style) -->
  <g stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7">
    <!-- Left Whiskers -->
    <line x1="22" y1="46" x2="42" y2="49"/>
    <line x1="20" y1="56" x2="40" y2="56"/>
    <line x1="23" y1="66" x2="42" y2="63"/>
    <!-- Right Whiskers -->
    <line x1="98" y1="46" x2="78" y2="49"/>
    <line x1="100" y1="56" x2="80" y2="56"/>
    <line x1="97" y1="66" x2="78" y2="63"/>
  </g>

  <!-- Red Collar Ribbon -->
  <rect x="36" y="58" width="48" height="9" rx="4.5" fill="#EF4444"/>
  <rect x="36" y="58" width="48" height="9" rx="4.5" stroke="#B91C1C" stroke-width="1"/>

  <!-- Golden Bell Core -->
  <circle cx="60" cy="74" r="15" fill="url(#emblemBell)"/>
  <circle cx="60" cy="74" r="15" stroke="#78350F" stroke-width="1.2"/>
  <line x1="48" y1="71" x2="72" y2="71" stroke="#78350F" stroke-width="1.8"/>
  <circle cx="60" cy="77" r="2.8" fill="#451A03"/>
  <line x1="60" y1="79.8" x2="60" y2="87" stroke="#451A03" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Futuristic Corner Markers -->
  <path d="M16 30 L16 16 L30 16" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M104 30 L104 16 L90 16" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 90 L16 104 L30 104" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M104 90 L104 104 L90 104" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
</svg>
