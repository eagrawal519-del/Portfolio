<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="crumbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Memory Bread Loaf Slice -->
  <path d="M26 40 C26 22, 50 18, 60 22 C70 18, 94 22, 94 40 C98 56, 96 86, 92 96 C90 100, 30 100, 28 96 C24 86, 22 56, 26 40 Z" fill="url(#crustGrad)" stroke="#78350F" stroke-width="2"/>

  <!-- Bread Face (Inner Crumb Surface) -->
  <path d="M30 42 C30 26, 52 22, 60 26 C68 22, 90 26, 90 42 C94 56, 92 84, 88 92 C86 96, 34 96, 32 92 C28 84, 26 56, 30 42 Z" fill="url(#crumbGrad)"/>

  <!-- Imprinted Equations / Knowledge Glyphs -->
  <g stroke="#92400E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <!-- Math / Code Formulas Imprint -->
    <path d="M42 42 L52 42 M47 38 L47 46"/> <!-- Plus sign -->
    <text x="56" y="45" font-family="monospace" font-size="11" font-weight="bold" fill="#78350F">E=mc²</text>
    <line x1="38" y1="56" x2="82" y2="56"/>
    <text x="38" y="68" font-family="monospace" font-size="10" font-weight="bold" fill="#78350F">f(x) ⇒ &lt;/&gt;</text>
    <line x1="38" y1="76" x2="82" y2="76"/>
    <text x="44" y="87" font-family="monospace" font-size="9" font-weight="bold" fill="#78350F">AI + UI/UX</text>
  </g>

  <!-- Golden Knowledge Glow Particles -->
  <circle cx="22" cy="30" r="2" fill="#F59E0B"/>
  <circle cx="98" cy="36" r="2.5" fill="#FBBF24"/>
  <circle cx="94" cy="78" r="1.8" fill="#F59E0B"/>
  <circle cx="20" cy="70" r="2" fill="#FBBF24"/>
</svg>
