<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="propellerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Aerodynamic Blades (Rotor) -->
  <path d="M10 32 C25 24, 45 28, 50 32 C55 28, 75 24, 90 32 C95 35, 93 40, 85 40 C70 40, 55 35, 50 33 C45 35, 30 40, 15 40 C7 40, 5 35, 10 32 Z" fill="url(#propellerGrad)" stroke="#B45309" stroke-width="1.2"/>

  <!-- Blade Tips High-speed Blur Arc -->
  <path d="M6 35 A 46 16 0 0 1 94 35" stroke="#FDE047" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>

  <!-- Center Rotor Cap -->
  <circle cx="50" cy="32" r="5.5" fill="#DC2626" stroke="#991B1B" stroke-width="1"/>
  <circle cx="50" cy="32" r="2" fill="#FEF08A"/>

  <!-- Vertical Shaft -->
  <rect x="47.5" y="37" width="5" height="30" rx="2" fill="url(#shaftGrad)" stroke="#475569" stroke-width="1"/>
  <line x1="49" y1="38" x2="49" y2="66" stroke="#F8FAFC" stroke-width="0.8"/>

  <!-- Suction Cup / Helmet Mount Base -->
  <path d="M34 76 C34 68, 66 68, 66 76 C66 80, 60 82, 50 82 C40 82, 34 80, 34 76 Z" fill="#F59E0B" stroke="#B45309" stroke-width="1.2"/>
  <ellipse cx="50" cy="76" rx="14" ry="4" fill="#FDE047"/>
  <ellipse cx="50" cy="80" rx="16" ry="3" fill="#0284C7" opacity="0.3"/>
</svg>
